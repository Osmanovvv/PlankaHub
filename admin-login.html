<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planka Hub · Вход в админку</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --blue: #4475f2;
        --ink: #0b0c10;
        --muted: #8f96a3;
        --line: #e4e7ef;
        --bg: #f6f8fc;
        --white: #ffffff;
        --danger: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background:
          radial-gradient(circle at 28% 18%, rgba(68, 117, 242, 0.13), transparent 28%),
          radial-gradient(circle at 78% 78%, rgba(68, 117, 242, 0.1), transparent 30%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, Arial, sans-serif;
      }

      .login-card {
        width: min(100%, 420px);
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
      }

      .brand {
        display: inline-flex;
        margin-bottom: 28px;
        align-items: center;
        gap: 9px;
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
      }

      .brand-mark {
        display: inline-grid;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        place-items: center;
        background: var(--blue);
        color: var(--white);
        font-size: 12px;
        letter-spacing: -0.04em;
      }

      .brand span:last-child {
        color: var(--blue);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 34px;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 10px 0 26px;
        color: var(--muted);
        font-size: 14px;
        line-height: 22px;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        color: #4b5563;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        height: 48px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--white);
        color: var(--ink);
        font: 600 15px/1 Inter, Arial, sans-serif;
        outline: none;
      }

      input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(68, 117, 242, 0.12);
      }

      .error {
        display: none;
        margin: 0;
        color: var(--danger);
        font-size: 13px;
        font-weight: 700;
      }

      .error.is-visible {
        display: block;
      }

      .actions {
        display: flex;
        margin-top: 8px;
        align-items: center;
        gap: 12px;
      }

      button,
      a {
        display: inline-flex;
        height: 46px;
        border-radius: 10px;
        align-items: center;
        justify-content: center;
        font-family: Inter, Arial, sans-serif;
        font-size: 14px;
        font-weight: 800;
        line-height: 1;
        text-decoration: none;
      }

      button {
        flex: 1;
        border: 0;
        background: var(--blue);
        color: var(--white);
        cursor: pointer;
        box-shadow: 0 14px 28px rgba(68, 117, 242, 0.28);
      }

      a {
        min-width: 98px;
        padding: 0 14px;
        border: 1px solid var(--line);
        background: var(--white);
        color: var(--ink);
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .login-card {
          padding: 26px;
          border-radius: 16px;
        }

        h1 {
          font-size: 24px;
          line-height: 30px;
        }

        .actions {
          display: grid;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card" aria-labelledby="admin-login-title">
      <div class="brand" aria-label="Planka Hub">
        <span class="brand-mark">PH</span>
        <strong>Planka <span>Hub</span></strong>
      </div>

      <h1 id="admin-login-title">Вход в админку</h1>
      <p class="subtitle">Введите логин и пароль, чтобы открыть заявки и экспорт.</p>

      <form action="/admin/login" method="post">
        <label>
          Логин
          <input name="username" autocomplete="username" required autofocus />
        </label>

        <label>
          Пароль
          <input name="password" type="password" autocomplete="current-password" required />
        </label>

        <p class="error" data-error>Неверный логин или пароль.</p>

        <div class="actions">
          <button type="submit">Войти</button>
          <a href="/">На сайт</a>
        </div>
      </form>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.has('error')) {
        document.querySelector('[data-error]').classList.add('is-visible');
      }
    </script>
  </body>
</html>
